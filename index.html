<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markets Dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#12151c;--mu:#6b7280;--bd:#e5e7eb;--up:#0f9d58;--dn:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#141821;--tx:#eef1f6;--mu:#8b94a5;--bd:#232937;--up:#34d399;--dn:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0}.live{font-size:12px;color:var(--mu)}
.rb{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.rb button{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.rb button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.note{background:var(--card);border:1px solid var(--bd);border-left:3px solid #f59e0b;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mu);line-height:1.45}
h2{font-size:18px;margin:26px 0 2px}h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .15s}
.c:hover{transform:translateY(-2px)}.c.up{border-color:#86efac}.c.dn{border-color:#fca5a5}.c.off{cursor:default;opacity:.7}.c.off:hover{transform:none}
.l{min-width:0}.n{font-size:14px;font-weight:600}.s{font-size:12px;color:var(--mu);margin-top:1px}
.p{font-size:24px;font-weight:700;margin:8px 0 2px;font-variant-numeric:tabular-nums}.p2{font-size:17px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.up .d,.d.up{color:var(--up)}.dn .d,.d.dn{color:var(--dn)}.f{font-size:11px;color:var(--mu);margin-top:4px}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}.cvt{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:16px;margin-top:6px}.cr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cr input,.cr select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}.cr input{width:150px;flex:1 1 130px}.cr select{flex:1 1 150px}.cr button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer}.res{font-size:30px;font-weight:700;margin:14px 0 2px;font-variant-numeric:tabular-nums}.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.ga div{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mu)}.ga b{display:block;font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums}.cf{display:none;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:6px 0}.cf label{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:8px}.cf select,.cf input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}.cf button{border:1px solid var(--bd);background:transparent;color:var(--mu);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}.cf button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.cf input{flex:1 1 150px}.ga2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.ga2 div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--mu)}.ga2 b{display:block;font-size:14px;color:var(--tx);margin-top:2px;font-variant-numeric:tabular-nums}.mk{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}.mk.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}.mk.off{background:#ef4444}.dt{font-size:11px;color:var(--mu);white-space:nowrap}.sp{width:100px;height:56px;flex:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;z-index:9}.ov.show{display:flex}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:900px;position:relative}
.x{position:absolute;top:12px;right:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:32px;height:32px;border-radius:50%;cursor:pointer}
.ph{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-right:40px}.ph h2{margin:0}.ph small{color:var(--mu)}
#ab{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--mu);margin-bottom:14px}
.rg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.rg button{border:1px solid var(--bd);background:transparent;color:var(--mu);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600}.rg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cv{position:relative;height:330px}canvas.big{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;display:none;white-space:nowrap}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:14px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.st div{background:var(--bg);border-radius:10px;padding:10px 12px}.st span{display:block;font-size:12px;color:var(--mu)}.st b{font-size:15px}
@media(max-width:560px){.g{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.c{flex-direction:column;align-items:stretch;padding:12px}.r{align-items:stretch}.sp{width:100%}.p{font-size:20px}}
</style></head><body><div class="w">
<header><h1>Markets Dashboard</h1><div class="live" id="ts">Loading…</div></header>
<div class="rb" id="rb"></div>
<div class="note" id="note"><b>Loading live prices…</b></div>
<div class="cf" id="cf" style="display:none"><label>Base currency <select id="fb" aria-label="Base currency"></select></label>
<button id="fm" type="button">1 <span class="bc">INR</span> gets you MORE than 1 unit</button><button id="fl" type="button">1 <span class="bc">INR</span> gets you LESS than 1 unit</button>
<input id="fs" type="search" placeholder="Search currency" aria-label="Search currency"></div>
<div id="fxl"></div>
<div class="cvt" id="conv" style="display:none"><h3 style="margin-top:0">Currency converter · live rates</h3>
<div class="cr"><input id="amt" type="number" value="100" min="0" step="any" inputmode="decimal" aria-label="Amount"><select id="fr" aria-label="From"></select><button id="sw" title="Swap" aria-label="Swap">⇄</button><select id="to" aria-label="To"></select></div>
<div class="res" id="res">—</div><div class="f" id="rt"></div><h3>Same amount in popular currencies</h3><div class="ga" id="all"></div><div class="f" style="margin-top:12px">Major currencies use live Yahoo Finance rates. All other currencies use daily rates: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener" style="color:inherit">Rates By Exchange Rate API</a>.</div></div>
<div id="app"></div>
</div>
<div class="ov" id="ov"><div class="panel"><button class="x" id="x" aria-label="Close">✕</button>
<div class="ph"><div><h2 id="ct"></h2><small id="cs"></small></div><div id="cc" style="text-align:right"></div></div>
<div id="ab"></div><div class="rg" id="rg"></div>
<div class="cv"><canvas class="big" id="cv"></canvas><div class="msg" id="msg" style="display:none"></div><div id="tip"></div></div>
<div class="st" id="st"></div></div></div>
<script>
const OZ=31.1035,U={gold:10/OZ,silver:1000/OZ}; // INR unit: per 10 g (gold), per kg (silver)
const fmtDay=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
// id, name, subtitle, symbol, type (m = metal shown in USD and INR), about
const SEC=[
['indices','Indices',[
 ['America',[
  ['spx','S&P 500','US large-cap index','^GSPC','','Tracks 500 of the largest US listed companies.'],
  ['ndx','Nasdaq Composite','US technology-heavy index','^IXIC','','Covers almost all stocks listed on the Nasdaq exchange, with a heavy technology weighting.'],
  ['dji','Dow Jones Industrial Average','US blue-chip index','^DJI','','Price-weighted index of 30 large US companies.'],
  ['ym','Dow Jones Futures','E-mini futures · trades nearly 24h','YM=F','','Futures contract on the Dow. It trades outside normal stock hours, so it shows early market direction.']]],
 ['Europe',[
  ['dax','DAX 40','Germany','^GDAXI','','Germany\'s 40 largest listed companies.'],
  ['ftse','FTSE 100','United Kingdom','^FTSE','','The 100 largest companies listed on the London Stock Exchange.'],
  ['sx5e','Euro Stoxx 50','Eurozone blue chips','^STOXX50E','','50 leading companies from eurozone countries.'],
  ['sxxp','STOXX Europe 600','All-Europe market index','^STOXX','','600 companies across 17 European countries. The broadest measure of the European market.']]],
 ['Asia',[
  ['n225','Nikkei 225','Japan','^N225','','Japan\'s main stock index, covering 225 large Tokyo-listed companies.'],
  ['hsi','Hang Seng Index','Hong Kong','^HSI','','Main index of the Hong Kong stock market.'],
  ['sse','Shanghai Composite','China · Shanghai','000001.SS','','Tracks all stocks listed on the Shanghai Stock Exchange, China\'s main stock index.'],
  ['szse','Shenzhen Component','China · Shenzhen','399001.SZ','','Tracks 500 large companies listed on the Shenzhen Stock Exchange, with more tech and private firms.'],
  ['sensex','BSE Sensex','India','^BSESN','','30 large companies listed on the Bombay Stock Exchange.'],
  ['nifty','Nifty 50','India','^NSEI','','50 large companies listed on the National Stock Exchange of India.']]]]],
['oil','Crude Oil',[
 ['Benchmarks · USD per barrel',[
  ['wti','WTI Crude Oil','US benchmark · NYMEX','CL=F','','West Texas Intermediate. Produced in the United States (Texas, New Mexico, Oklahoma, North Dakota) and priced at Cushing, Oklahoma.'],
  ['brent','Brent Crude Oil','Global benchmark · North Sea','BZ=F','','The global benchmark. Produced in the UK and Norway (North Sea); the price basket also includes US WTI Midland. Oil from many countries is priced against Brent.']]]]],
['commodities','Commodities',[
 ['Precious metals · USD per troy ounce · INR per 10 g (gold) and per kg (silver)',[
  ['gold','Gold (XAU)','COMEX futures · USD per oz','GC=F','m','Precious metal and safe-haven asset. Prices are COMEX futures in USD per troy ounce. INR is shown per 10 grams, converted at the live USD/INR rate. It excludes Indian import duty and GST, so local jeweller rates will differ.'],
  ['silver','Silver (XAG)','COMEX futures · USD per oz','SI=F','m','Both a precious and an industrial metal (electronics, solar). Prices are COMEX futures in USD per troy ounce. INR is shown per kilogram, converted at the live USD/INR rate. It excludes Indian import duty and GST.']]]]],
['fx','Currencies',[
 ['Major pairs',[
  ['eurusd','EUR / USD','Euro to US Dollar','EURUSD=X','fx','The most traded currency pair in the world. The price is how many US dollars one euro buys.'],
  ['gbpusd','GBP / USD','British Pound to US Dollar','GBPUSD=X','fx','Known as Cable. The price is how many US dollars one pound sterling buys.'],
  ['usdjpy','USD / JPY','US Dollar to Japanese Yen','JPY=X','fx','How many Japanese yen one US dollar buys.'],
  ['usdchf','USD / CHF','US Dollar to Swiss Franc','CHF=X','fx','How many Swiss francs one US dollar buys. The franc is often treated as a safe-haven currency.'],
  ['audusd','AUD / USD','Australian Dollar to US Dollar','AUDUSD=X','fx','How many US dollars one Australian dollar buys. Often moves with commodity prices.'],
  ['usdcad','USD / CAD','US Dollar to Canadian Dollar','CAD=X','fx','How many Canadian dollars one US dollar buys. Often moves with oil prices.'],
  ['usdcny','USD / CNY','US Dollar to Chinese Yuan','CNY=X','fx','How many Chinese yuan one US dollar buys.'],
  ['usdaed','USD / AED','US Dollar to UAE Dirham','AED=X','fx','How many UAE dirhams one US dollar buys. The dirham is pegged to the dollar, so this barely moves.']]],
 ['Indian rupee pairs',[
  ['usdinr','USD / INR','US Dollar to Indian Rupee','INR=X','fx','How many Indian rupees one US dollar buys.'],
  ['eurinr','EUR / INR','Euro to Indian Rupee','EURINR=X','fx','How many Indian rupees one euro buys.'],
  ['gbpinr','GBP / INR','British Pound to Indian Rupee','GBPINR=X','fx','How many Indian rupees one pound sterling buys.']]]]]];
const TABS=[['all','All'],['indices','Indices'],['oil','Crude Oil'],['commodities','Commodities'],['fx','Currencies']];
const R=['1D','5D','15D','1M','3M','6M','1Y','YTD','MAX'];
const $=id=>document.getElementById(id),f=(x,d=2)=>x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const ITEMS={};SEC.forEach(g=>g[2].forEach(s=>s[1].forEach(i=>ITEMS[i[0]]=i)));
let Q={},tab='all',cur='usd',sel=null,rng='1D',hov=null,HC={};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// quote -> display model for an item in currency c
function model(it,c){const q=Q[it[3]];if(!it[3]||!q||q.price==null||!q.prev)return null;
 let p=q.price,pv=q.prev,sp=q.spark||[];
 if(c==='inr'){const x=Q['INR=X'];if(!x)return null;const k=x.price*(U[it[0]]||1),k2=x.prev*(U[it[0]]||1);p*=k;pv*=k2;sp=sp.map(v=>v*k)}
 return{p,ch:p-pv,pc:(p-pv)/pv*100,sp,up:p>=pv}}
const dot=it=>{const o=Q[it[3]]&&Q[it[3]].open;return`<span class="mk ${o?'on':'off'}" title="${o?'Market open':'Market closed'}"></span>`};
const dgt=(it,v)=>it[4]==='fx'?(Math.abs(v)<10?4:2):2;
const sym=(it,c)=>it[4]==='m'?(c==='inr'?'₹':'$'):(it[3]==='CL=F'||it[3]==='BZ=F'?'$':'');
const chtxt=(m,d=2)=>`${m.up?'▲':'▼'} ${f(Math.abs(m.ch),d)} (${f(Math.abs(m.pc))}%)`;
function spark(cv,v,col){if(v.length<2)return;const x=cv.getContext('2d'),d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.scale(d,d);
 const mn=Math.min(...v),mx=Math.max(...v),Y=a=>4+(1-(a-mn)/(mx-mn||1))*(H-8),X=i=>i/(v.length-1)*W,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
 x.beginPath();v.forEach((a,i)=>i?x.lineTo(X(i),Y(a)):x.moveTo(X(i),Y(a)));x.strokeStyle=col;x.lineWidth=1.8;x.lineJoin='round';x.stroke();x.lineTo(W,H);x.lineTo(0,H);x.fillStyle=g;x.fill()}
function card(it){const m=model(it,'usd');
 if(!m)return`<button class="c off" disabled data-id="${it[0]}"><div class="l"><div class="n">${dot(it)}${it[1]}</div><div class="s">${it[2]}</div><div class="p">—</div><div class="f">Waiting for data…</div></div></button>`;
 let extra='';
 if(it[4]==='m'){const mi=model(it,'inr');if(mi)extra=`<div class="p2">₹${f(mi.p,0)}</div><div class="d ${mi.up?'up':'dn'}">${chtxt(mi,0)}</div><div class="f">INR per ${it[0]==='gold'?'10 g':'kg'} · before duty and tax</div>`}
 return`<button class="c ${m.up?'up':'dn'}" data-id="${it[0]}"><div class="l"><div class="n">${dot(it)}${it[1]}</div><div class="s">${it[2]}</div><div class="p">${sym(it,'usd')}${f(m.p,dgt(it,m.p))}</div><div class="d">${chtxt(m,dgt(it,m.p))}</div>${extra}</div><div class="r"><div class="dt">${fmtDay(Q[it[3]].day)}</div><canvas class="sp" data-id="${it[0]}"></canvas></div></button>`}
function renderCards(){$('app').innerHTML=SEC.filter(g=>tab==='all'||g[0]===tab).map(g=>(tab==='all'?`<h2>${g[1]}</h2>`:'')+g[2].map(s=>`<h3>${s[0]}</h3><div class="g">${s[1].map(card).join('')}</div>`).join('')).join('');
 document.querySelectorAll('.sp').forEach(cv=>{const it=ITEMS[cv.dataset.id],m=model(it,'usd');if(m)spark(cv,m.sp,css(m.up?'--up':'--dn'))});
 document.querySelectorAll('.c:not(.off)').forEach(b=>b.onclick=()=>openP(b.dataset.id))}
// ---- currency converter + filters. Rates cross through USD. Yahoo (live) for majors, daily ER rates for all others ----
const POP=['USD','EUR','GBP','JPY','INR','CNY','AUD','CAD','CHF','AED'];
const YF={EUR:['EURUSD=X',0],GBP:['GBPUSD=X',0],JPY:['JPY=X',1],INR:['INR=X',1],CNY:['CNY=X',1],AUD:['AUDUSD=X',0],CAD:['CAD=X',1],CHF:['CHF=X',1],AED:['AED=X',1]};
let ER=null,fmode=null,DN=null;try{DN=new Intl.DisplayNames(['en'],{type:'currency'})}catch(e){}
const nm=c=>{try{return DN?DN.of(c):c}catch(e){return c}};
const live=c=>c==='USD'||(YF[c]&&Q[YF[c][0]]&&Q[YF[c][0]].price);
function usd(c){if(c==='USD')return 1;const y=YF[c],q=y&&Q[y[0]];if(q&&q.price)return y[1]?1/q.price:q.price;if(ER&&ER[c])return 1/ER[c];return null}
const codes=()=>ER?Object.keys(ER).sort():POP;
const cf=v=>f(v,v<1?4:2),rf=v=>f(v,v<0.01?6:v<1?4:2);
function conv(){const a=parseFloat($('amt').value)||0,F=$('fr').value,T=$('to').value,uf=usd(F),ut=usd(T);
 if(uf==null||ut==null){$('res').textContent='Waiting for rates…';$('rt').textContent='';$('all').innerHTML='';return}
 $('res').textContent=`${cf(a*uf/ut)} ${T}`;
 $('rt').textContent=`1 ${F} = ${rf(uf/ut)} ${T} · ${live(F)&&live(T)?'live rate via Yahoo Finance, may be delayed ~15 min':'daily rate (ExchangeRate-API)'}`;
 $('all').innerHTML=POP.filter(c=>c!==F&&usd(c)).map(c=>`<div>${c} · ${nm(c)}<b>${cf(a*uf/usd(c))}</b></div>`).join('')}
function fillSel(){const o=codes().map(c=>`<option value="${c}">${c} · ${nm(c)}</option>`).join('');
 [['fr','USD'],['to','INR'],['fb','INR']].forEach(([i,d])=>{const e=$(i),v=e.value||d;e.innerHTML=o;e.value=codes().includes(v)?v:d})}
function renderList(){const L=$('fxl'),B=$('fb').value||'INR';document.querySelectorAll('.bc').forEach(e=>e.textContent=B);
 $('fm').classList.toggle('on',fmode==='more');$('fl').classList.toggle('on',fmode==='less');
 if(!fmode){L.innerHTML='';return}
 if(!ER){L.innerHTML='<div class="note" style="margin:8px 0">Loading all currencies…</div>';return}
 const ub=usd(B),q=$('fs').value.trim().toLowerCase();
 const rows=codes().filter(c=>c!==B).map(c=>[c,ub/usd(c)]).filter(([c,x])=>isFinite(x)&&(fmode==='more'?x>1:x<1)&&(!q||(c+' '+nm(c)).toLowerCase().includes(q))).sort((a,b)=>fmode==='more'?b[1]-a[1]:a[1]-b[1]);
 L.innerHTML=`<h3>1 ${B} gets you ${fmode==='more'?'MORE':'LESS'} than 1 unit of these currencies · ${rows.length}</h3><div class="ga2">`+rows.map(([c,x])=>`<div>${c} · ${nm(c)}<b>1 ${B} = ${rf(x)} ${c}</b></div>`).join('')+'</div>'}
async function loadRates(){try{const r=await fetch('/.netlify/functions/rates');if(!r.ok)throw 0;const j=await r.json();if(!j.rates)throw 0;ER=j.rates;fillSel();conv();renderList()}catch(e){}}
function initConv(){fillSel();['amt','fr','to'].forEach(i=>$(i).oninput=conv);$('sw').onclick=()=>{const t=$('fr').value;$('fr').value=$('to').value;$('to').value=t;conv()};
 $('fb').onchange=renderList;$('fs').oninput=renderList;
 $('fm').onclick=()=>{fmode=fmode==='more'?null:'more';renderList()};$('fl').onclick=()=>{fmode=fmode==='less'?null:'less';renderList()}}
function syncConv(){const on=tab==='fx';$('conv').style.display=on?'block':'none';$('cf').style.display=on?'flex':'none';$('fxl').style.display=on?'block':'none'}
function ribbon(){$('rb').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-k="${k}">${l}</button>`).join('');
 document.querySelectorAll('#rb button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;ribbon();renderCards();syncConv()})}
async function load(){try{const r=await fetch('/.netlify/functions/quotes');if(!r.ok)throw 0;Q=await r.json();renderCards();conv();renderList();if(sel)head();
 $('ts').textContent='Updated '+new Date().toLocaleTimeString();
 $('note').innerHTML='<b>Live data</b> via Yahoo Finance, refreshed every 60 seconds. Prices can be delayed up to ~15 minutes. Oil, gold, silver and Dow Futures are futures prices. <span class="mk on" style="margin:0 4px 0 2px"></span>green dot = market open, <span class="mk off" style="margin:0 4px 0 2px"></span>red dot = closed (the card then shows the last trading day).  Not financial advice.'}
 catch(e){$('note').innerHTML='<b>Could not load prices.</b> Check that the Netlify functions are deployed. Retrying…'}}
// ---- detail panel ----
function openP(id){sel=id;rng='1D';cur='usd';$('ov').classList.add('show');$('ct').textContent=ITEMS[id][1];$('cs').textContent=ITEMS[id][2];$('ab').textContent=ITEMS[id][5];head();pick()}
function closeP(){sel=null;$('ov').classList.remove('show')}
$('x').onclick=closeP;$('ov').onclick=e=>{if(e.target.id==='ov')closeP()};addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
function head(){const it=ITEMS[sel],d=HC[it[3]+rng+cur],m=model(it,cur),sy=sym(it,cur),dg=cur==='inr'?0:dgt(it,m?m.p:(d?d.p[d.p.length-1]:1));let h='';
 let b=m?m.p:(d?d.p[d.p.length-1]:null),ch=null,pc=null;
 if(rng==='1D'&&m){ch=m.ch;pc=m.pc}else if(d&&b!=null){const a=d.p[0];ch=b-a;pc=ch/a*100}
 if(b!=null){const up=ch==null||ch>=0,col=css(up?'--up':'--dn');h=`<div style="font-size:26px;font-weight:700">${sy}${f(b,dg)}</div>`+(ch==null?'':`<div style="font-weight:600;font-size:13px;color:${col}">${up?'▲':'▼'} ${f(Math.abs(ch),dg)} (${f(Math.abs(pc))}%) · ${rng}${rng==='1D'?' · '+fmtDay(Q[it[3]]&&Q[it[3]].day):''}</div>`)}
 $('ct').innerHTML=dot(it)+it[1];$('cc').innerHTML=h;$('cs').textContent=it[2]+(cur==='inr'?' · INR per '+(it[0]==='gold'?'10 g':'kg')+', before duty and tax':'');
 $('rg').innerHTML=(it[4]==='m'?['usd','inr'].map(c=>`<button class="${c===cur?'on':''}" data-c="${c}">${c.toUpperCase()}</button>`).join('')+'<span style="width:8px"></span>':'')+R.map(r=>`<button class="${r===rng?'on':''}" data-r="${r}">${r==='MAX'?'Max':r}</button>`).join('');
 document.querySelectorAll('#rg [data-r]').forEach(b=>b.onclick=()=>{rng=b.dataset.r;head();pick()});
 document.querySelectorAll('#rg [data-c]').forEach(b=>b.onclick=()=>{cur=b.dataset.c;head();pick()})}
async function pick(){const it=ITEMS[sel],key=it[3]+rng+cur,msg=$('msg');
 if(!HC[key]){msg.style.display='flex';msg.textContent='Loading chart…';draw();
  try{const r=await fetch(`/.netlify/functions/history?s=${encodeURIComponent(it[3])}&r=${rng}&fx=${cur==='inr'?1:0}`);if(!r.ok)throw 0;const d=await r.json();if(!d.p||d.p.length<2)throw 0;if(cur==='inr'&&it[4]==='m')d.p=d.p.map(v=>v*U[it[0]]);HC[key]=d}
  catch(e){if(key===ITEMS[sel][3]+rng+cur){msg.textContent='Chart data is not available right now.';$('st').innerHTML=''}return}}
 if(key!==ITEMS[sel]?.[3]+rng+cur)return;msg.style.display='none';draw();stats();head()}
function stats(){const d=HC[ITEMS[sel][3]+rng+cur];if(!d)return;const p=d.p,rt=p.slice(1).map((x,i)=>Math.log(x/p[i])),m=rt.reduce((a,b)=>a+b,0)/rt.length,sd=Math.sqrt(rt.reduce((a,b)=>a+(b-m)**2,0)/rt.length)*100,s=sym(ITEMS[sel],cur);
 $('st').innerHTML=[['Open',p[0]],['High',Math.max(...p)],['Low',Math.min(...p)],['Range',Math.max(...p)-Math.min(...p)]].map(([l,v])=>`<div><span>${l}</span><b>${s}${f(v,dgt(ITEMS[sel],v))}</b></div>`).join('')+`<div><span>Volatility (σ per point)</span><b>${f(sd)}%</b></div>`}
function draw(){if(!sel)return;const it=ITEMS[sel],d=HC[it[3]+rng+cur],cv=$('cv'),x=cv.getContext('2d'),dp=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dp;cv.height=H*dp;x.scale(dp,dp);$('tip').style.display='none';if(!d)return;
 const up=d.p[d.p.length-1]>=d.p[0],col=css(up?'--up':'--dn'),mu=css('--mu'),gr=css('--bd'),P=d.p,mn=Math.min(...P),mx=Math.max(...P),pd=(mx-mn)*.08||1,lo=mn-pd,hi=mx+pd,L=8,Rr=66,T=10,B=24,w=W-L-Rr,h=H-T-B,n=P.length,X=i=>L+i/(n-1)*w,Y=v=>T+(1-(v-lo)/(hi-lo))*h;
 x.font='11px system-ui';x.lineWidth=1;
 for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,y=Y(v);x.strokeStyle=gr;x.beginPath();x.moveTo(L,y);x.lineTo(L+w,y);x.stroke();x.fillStyle=mu;x.textAlign='left';x.fillText(f(v,v>1000?0:dgt(it,v)),L+w+6,y+4)}
 x.textAlign='center';for(let i=0;i<5;i++){const j=Math.round(i*(n-1)/4),t=new Date(d.t[j]);x.fillStyle=mu;x.fillText(rng==='1D'||rng==='5D'?t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):(rng==='MAX'||rng==='1Y'?t.toLocaleDateString([],{month:'short',year:'2-digit'}):t.toLocaleDateString([],{month:'short',day:'numeric'})),Math.min(Math.max(X(j),24),L+w-10),H-6)}
 const g=x.createLinearGradient(0,T,0,T+h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.beginPath();P.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';x.stroke();x.lineTo(X(n-1),T+h);x.lineTo(L,T+h);x.fillStyle=g;x.fill();
 if(hov!=null){const i=Math.max(0,Math.min(n-1,Math.round((hov-L)/w*(n-1)))),t=new Date(d.t[i]),tp=$('tip');x.strokeStyle=mu;x.beginPath();x.moveTo(X(i),T);x.lineTo(X(i),T+h);x.stroke();x.fillStyle=col;x.beginPath();x.arc(X(i),Y(P[i]),4,0,7);x.fill();
  tp.style.display='block';tp.innerHTML=`<b>${sym(it,cur)}${f(P[i],dgt(it,P[i]))}</b><br>${t.toLocaleString([],{dateStyle:'medium',timeStyle:(rng==='1D'||rng==='5D'||rng==='15D')?'short':undefined})}`;tp.style.left=Math.min(X(i)+10,W-140)+'px';tp.style.top=Math.max(Y(P[i])-50,0)+'px'}}
const cv=$('cv');cv.onmousemove=e=>{hov=e.offsetX;draw()};cv.onmouseleave=()=>{hov=null;draw()};cv.ontouchmove=e=>{hov=e.touches[0].clientX-cv.getBoundingClientRect().left;draw()};cv.ontouchend=()=>{hov=null;draw()};
addEventListener('resize',()=>{renderCards();draw()});
initConv();syncConv();ribbon();load();loadRates();setInterval(loadRates,3*36e5);setInterval(load,60000);
</script></body></html>
